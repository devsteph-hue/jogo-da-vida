:root,:root[data-theme="light"]{--bg:#FFF4E8;--sf:#FFFFFF;--sf2:#F6EBDD;--ln:#E9DCCB;--tx:#2A2230;--mu:#7C7079;--pe:#FF9B6A;--pe2:#F07A45;--li:#8C78E8;--mi:#7FA85F;--sky:#CFE6F5;--sage:#B7CFA4;--bad:#E25C74;--ol:#2A2230;--sh:3px 4px 0 var(--ol);color-scheme:light}

/* escolher e editar treinos */

.t-eu{left:50%;margin-left:-62px;width:124px;bottom:8px}.t-eu .tsvg{width:124px;height:174px}
.t-preto{left:4%;width:104px}.t-preto .tsvg{width:104px;height:104px}

.zz{position:absolute;top:0;right:4px;font-size:18px;color:var(--li);animation:tzz 2s infinite}.zz i{font-style:normal;font-size:13px}

const ANIMS=new Map();
function animate(svg,id){const P=EX[id].P;let t0=performance.now();const per=P.length>2?1100:1300;const step=now=>{if(!svg.isConnected){ANIMS.delete(svg);return}const t=(now-t0)/per;const n=P.length;let i,j,u;
    if(n===2){const c=t%2;u=c<1?c:2-c;i=0;j=1}else{const c=t%n;i=Math.floor(c);j=(i+1)%n;u=c-i}const e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    const A=P[i],B=P[j];const len=Math.max(A.length,B.length);const pose=[];for(let k=0;k<len;k++){const a=A[k]??A[k-4]??0,b=B[k]??B[k-4]??0;pose.push(a+(b-a)*e)}
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches||!svg.dataset.drawn){drawFig(svg,pose);svg.dataset.drawn=1}ANIMS.set(svg,requestAnimationFrame(step))};ANIMS.set(svg,requestAnimationFrame(step))}

  beep(1320,.5,.35);if(FOCO.phase==='foco'){FOCO.cycles++;const t=tmr('estudo');t.total+=25*60;const B=buildDay(new Date()).find(b=>b.id==='estudo');if(B&&t.total>=B.dur*60)day().done.estudo=true;save();toast('Foco concluído: +25 min de estudo');FOCO.phase='pausa';FOCO.len=(FOCO.cycles%4===0?15:5)*60}else{FOCO.phase='foco';FOCO.len=25*60;toast('Pausa acabou. Bora!')}

const CAL={on:{},vol:{},buf:{},src:{},gain:{},master:null,timerEnd:0,timerLen:0,narr:false};
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();if(!CAL.master){CAL.master=AC.createGain();CAL.master.gain.value=1;CAL.master.connect(AC.destination)}return AC}
async function sndBuf(id){if(CAL.buf[id])return CAL.buf[id];const b64=SND[id].split(',')[1];const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return CAL.buf[id]=await new Promise((res,rej)=>ac().decodeAudioData(u.buffer,res,rej))}
async function sndOn(id,vol){const a=ac();if(CAL.src[id])return;CAL.on[id]=true;const buf=await sndBuf(id);if(!CAL.on[id])return;const s=a.createBufferSource();s.buffer=buf;s.loop=true;s.loopStart=.06;s.loopEnd=buf.duration-.06;const g=a.createGain();g.gain.setValueAtTime(0,a.currentTime);g.gain.linearRampToValueAtTime(vol??CAL.vol[id]??.7,a.currentTime+2);
  s.connect(g);g.connect(CAL.master);s.start(0,.06);CAL.src[id]=s;CAL.gain[id]=g}
function sndOff(id,fade=1.5){CAL.on[id]=false;const s=CAL.src[id],g=CAL.gain[id];if(!s)return;const a=ac();g.gain.cancelScheduledValues(a.currentTime);g.gain.setValueAtTime(g.gain.value,a.currentTime);g.gain.linearRampToValueAtTime(0,a.currentTime+fade);setTimeout(()=>{try{s.stop()}catch(e){}},fade*1000+50);delete CAL.src[id];delete CAL.gain[id]}
function sndToggle(id){if(CAL.on[id])sndOff(id);else sndOn(id);if(!Object.values(CAL.on).some(Boolean))CAL.timerEnd=0;render()}
function sndVol(id,v){CAL.vol[id]=+v;const g=CAL.gain[id];if(g){const a=ac();g.gain.cancelScheduledValues(a.currentTime);g.gain.setTargetAtTime(+v,a.currentTime,.1)}}
function sndAllOff(){for(const id of Object.keys(CAL.on))if(CAL.on[id])sndOff(id,3);CAL.timerEnd=0}
function sndTimer(min){CAL.timerLen=min*60;CAL.timerEnd=min?Date.now()+min*60000:0;render()}
// sino de tigela tibetana, sintetizado (sem arquivo)
function bell(f0=196,dur=6){const a=ac(),t=a.currentTime;[[1,.5],[2.74,.22],[5.42,.12],[8.93,.06]].forEach(([m,v])=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f0*m;o.detune.value=(Math.random()-.5)*8;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*.35,t+.02);g.gain.exponentialRampToValueAtTime(.0005,t+dur/Math.pow(m,.4));o.connect(g);g.connect(CAL.master);o.start(t);o.stop(t+dur)})}

const FASES=[['Adaptação','Aprender a técnica com carga leve e criar o hábito',3,[12,15],60],['Hipertrofia I','Ganhar músculo com volume moderado',4,[10,12],75],['Força I','Carga mais pesada, poucas repetições, descanso longo',5,[5,6],120],
 ['Hipertrofia II','Mais carga que na fase 2, repetições médias',4,[8,10],90],['Resistência','Muitas repetições e pouco descanso, fôlego',3,[15,20],45],['Força II','Subir as cargas de novo, com técnica perfeita',5,[4,6],150],
 ['Hipertrofia III','Última série de cada exercício perto da falha',4,[10,12],60],['Potência','Movimentos rápidos e explosivos na subida',4,[6,6],90],['Hipertrofia IV','Volume alto, cargas das fases de força',4,[8,12],75],
 ['Força III','Os maiores pesos da jornada',5,[3,5],180],['Consolidação e recordes','Manter o que conquistou e testar seus recordes',3,[8,10],90]];
const EXTYPE={prancha:'tempo',polichinelo:'cardio',escalador:'cardio',extensora:'iso',panturrilha:'iso',rosca:'iso',triceps:'iso',abdominal:'iso',ponte:'iso',superman:'iso'};
const BODYW=new Set(['flexao','barra','mergulho','afundo','agachamento','saltoagach','ponte','abdominal','superman']);
function progAt(d){d=d||new Date();const jd=Math.max(1,jDay(d));const sN=Math.min(NSEAS(),Math.floor((jd-1)/66)+1);const inS=jd-(sN-1)*66;const wk=Math.ceil(inS/7);const F=FASES[(sN-1)%FASES.length];
  return {season:sN,phase:F[0],obj:F[1],sets:F[2],reps:F[3],rest:F[4],week:wk,weeks:Math.ceil(sLen(sN)/7),deload:wk===5||wk===9}}
function repTxt(r){return r[0]===r[1]?`${r[0]}`:`${r[0]}–${r[1]}`}
function exParams(e,P,mode){const t=EXTYPE[e.id];if(t==='tempo')return {sets:P.deload?2:3,reps:[30+P.season*3,30+P.season*3],rest:45,unit:'s'};if(t==='cardio')return {sets:P.deload?2:3,reps:[30+P.season*2,40+P.season*2],rest:30,unit:'rep'};
  let sets=t==='iso'?Math.min(3,P.sets):P.sets,reps=t==='iso'?[Math.max(10,P.reps[0]),Math.max(12,P.reps[1])]:P.reps.slice();
  if(mode==='casa'&&BODYW.has(e.id)){const k={flexao:.8,barra:.45,mergulho:.9}[e.id]||1.5;reps=reps.map(x=>Math.max(2,Math.round(x*k)))}if(P.deload)sets=Math.max(2,Math.round(sets*.6));return {sets,reps,rest:P.rest,unit:'rep'}}
function planFor(mode,i){const P=progAt();const p=S.plans[mode][i];const ex=p.ex.slice();const sh=(P.season-1)%Math.max(1,ex.length);const rot=ex.slice(sh).concat(ex.slice(0,sh));// rodízio da ordem a cada temporada
  return {name:p.name,ex:rot.map(e=>{const q=exParams(e,P,mode);return {...e,sets:q.sets,reps:q.reps[1],range:q.reps,rest:q.rest,unit:q.unit}})}}
function todayPlan(mode){const n=S.history.filter(h=>h.mode===mode).length;return n%Math.max(1,S.plans[mode].length)}
function curGym(d){d=d||new Date();const dow=d.getDay(),work=(dow>=1&&dow<=5)||(dow===6&&S.workSat);return work&&d.getDate()<=15?(S.gymQ1||'casa'):S.gymMode}

/* ================= ESCOLHER A FASE DO PROGRAMA DE 2 ANOS ================= */
// O programa sugere a fase pela data (temporadas de 66 dias). Você pode escolher outra;
// a escolha vale até você voltar para a sugestão. Semana de descanso e temporada seguem a data.
const _progAt=progAt;
progAt=function(d){const P=_progAt(d);const sugIdx=(P.season-1)%FASES.length;
  if(S.fase==null||!FASES[S.fase])return {...P,sugIdx,escIdx:sugIdx,escolhida:false};
  const F=FASES[S.fase];return {...P,phase:F[0],obj:F[1],sets:F[2],reps:F[3],rest:F[4],sugIdx,escIdx:S.fase,escolhida:S.fase!==sugIdx,sugNome:FASES[sugIdx][0]}};
function escolherFase(i){const sug=(_progAt().season-1)%FASES.length;if(i===sug){S.fase=null;toast('Seguindo a sugestão do programa')}else{S.fase=i;toast('Fase '+FASES[i][0]+' escolhida')}save();render()}
function vFases(){const P=progAt();const fmtR=r=>r>=120?(r/60).toString().replace('.',',')+' min':r+' s';
  const lista=FASES.map((f,i)=>{const a=new Date(S.start+'T12:00:00');a.setDate(a.getDate()+(i%NSEAS())*66);const esc=i===P.escIdx,sug=i===P.sugIdx;
    return `<li class="${esc?'esc':''}"><div><b>${i+1}. ${f[0]}${sug?'<span class="tag">Sugerida agora</span>':''}${esc&&!sug?'<span class="tag eu">Sua escolha</span>':''}</b>
      <small>${f[2]} × ${repTxt(f[3])} · descanso ${fmtR(f[4])}</small><small>${f[1]}${i<NSEAS()?' · no programa: '+a.toLocaleDateString('pt-BR',{month:'short',year:'numeric'}):''}</small></div>
      ${esc?'<span class="pill">Em uso</span>':`<button class="mini" onclick="escolherFase(${i})">${sug?'Usar sugestão':'Escolher'}</button>`}</li>`}).join('');
  return `<details class="pall" ${P.escolhida?'open':''}><summary>Escolher a fase do treino (programa de 2 anos)</summary>
    <p class="muted" style="font-size:12.5px;margin:4px 0 6px">O programa sugere uma fase por temporada de 66 dias, mas você pode escolher qualquer uma. Séries, repetições e descanso de todos os treinos mudam junto.</p><ol class="fases">${lista}</ol></details>`}
const _vTreino2=vTreino;
vTreino=function(){let html=_vTreino2();const P=progAt();
  // troca a lista fixa do programa pela lista para escolher
  html=html.replace(/<details class="pall">[\s\S]*?<\/details>/,vFases());
  if(P.escolhida)html=html.replace('<div class="ptop">',`<div class="ptop"><span class="pill" style="background:#FFE08A">Fase escolhida por você</span>`)
    .replace(/(<details class="pall")/,`<div class="sugere">O programa sugere <b>${esc(P.sugNome)}</b> para esta temporada.<button class="mini" onclick="escolherFase(${P.sugIdx})">Voltar para a sugestão</button></div>$1`);
  return html};

   Você, o gato preto peludo, a frajola e o guardião siamês.
   Fome, limpeza, carinho e energia caem com o tempo (horas reais) e sobem
   com os cuidados aqui — e também quando você cumpre os hábitos de verdade:
   refeições alimentam você, skincare/cabelo deixam você limpinha, sono dá energia,
   e "Cuidar dos gatos" alimenta e limpa os gatinhos. Nada disso mexe no seu XP. */
const TAMA_DEF={t:0,sel:'eu',applied:{},
  eu:{nome:'Você',fome:80,limpeza:80,carinho:80,energia:80,roupa:'basico'},
  preto:{nome:'Pretinho',fome:80,limpeza:80,carinho:80,energia:80,coleira:'#E25C74'},

  guardiao:{nome:'Sião',fome:90,limpeza:90,carinho:90,energia:90,coleira:'#FFD27A'}};

const TDECAY={eu:{fome:5,limpeza:2.5,carinho:2,energia:3},preto:{fome:4,limpeza:2,carinho:3,energia:1.5},frajola:{fome:4,limpeza:2,carinho:3,energia:1.5},guardiao:{fome:2,limpeza:1,carinho:1.5,energia:1}};

function tama(){if(!S.tama)S.tama=JSON.parse(JSON.stringify(TAMA_DEF));for(const k of Object.keys(TAMA_DEF))if(S.tama[k]==null)S.tama[k]=JSON.parse(JSON.stringify(TAMA_DEF[k]));
  const T=S.tama,now=Date.now();if(!T.t)T.t=now;const h=Math.min(72,(now-T.t)/36e5);
  if(h>0.01){for(const [w] of TQUEM)for(const st in TDECAY[w])T[w][st]=Math.max(0,T[w][st]-TDECAY[w][st]*h);T.t=now}
  // hábitos de verdade cuidam da casinha (uma vez por hábito por dia)
  const k=dkey(new Date()),d=S.days[k];if(d&&d.done){const ap=T.applied;const once=(id,fn)=>{const key=k+':'+id;if(d.done[id]&&!ap[key]){ap[key]=1;fn()}};
    const up=(w,st,v)=>{T[w][st]=Math.min(100,T[w][st]+v)};
    for(const id of Object.keys(d.done)){if(/^ref_|^refeic|almoco|jantar|lanche|cafe/.test(id))once(id,()=>up('eu','fome',35))}
    once('pele_am',()=>up('eu','limpeza',30));once('pele_pm',()=>up('eu','limpeza',30));once('cabelo',()=>up('eu','limpeza',25));
    once('acordar',()=>up('eu','energia',40));once('dormir',()=>up('eu','energia',30));once('treino',()=>{up('eu','carinho',25);up('eu','energia',-10)});
    once('mae',()=>up('eu','carinho',20));once('gatos',()=>{for(const g of['preto','frajola']){up(g,'fome',50);up(g,'limpeza',40);up(g,'carinho',20)}});
    // limpa marcas antigas (mais de 10 dias)
    for(const key of Object.keys(ap))if(key.slice(0,10)<dkey(new Date(Date.now()-864e6)))delete ap[key]}
  return T}

async function c3GatoModelo(){if(C3.gatoM)return C3.gatoM;const T=V3.T;const L=v3Loader(V3.GL);

function c3Pintar(m,tipo){let mesh;m.traverse(o=>{if(o.isMesh)mesh=o});mesh.geometry.computeBoundingBox();const bb=mesh.geometry.boundingBox;
  m.traverse(o=>{if(!o.isMesh)return;o.material=o.material.clone();const U={bmin:{value:bb.min},bmax:{value:bb.max},tipo:{value:tipo}};o.material.customProgramCacheKey=()=>'gato'+tipo;
    o.material.onBeforeCompile=sh=>{Object.assign(sh.uniforms,U);sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vP;').replace('#include <begin_vertex>','#include <begin_vertex>\nvP=position;');
      sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vP;uniform vec3 bmin;uniform vec3 bmax;uniform int tipo;').replace('#include <map_fragment>',`#include <map_fragment>
       vec3 q=(vP-bmin)/(bmax-bmin);float mx=max(diffuseColor.r,max(diffuseColor.g,diffuseColor.b)),mn=min(diffuseColor.r,min(diffuseColor.g,diffuseColor.b));bool olho=(mx-mn)>0.18&&mx>0.25;
       if(tipo==1){ if(!olho) diffuseColor.rgb=min(diffuseColor.rgb,vec3(0.03)); else diffuseColor.rgb=vec3(0.95,0.75,0.15); }
       if(tipo==2){ float pt=0.0; pt=max(pt,1.0-smoothstep(0.20,0.34,q.y)); pt=max(pt,1.0-smoothstep(0.18,0.30,q.x)); pt=max(pt,(1.0-smoothstep(0.36,0.44,q.x))*smoothstep(0.66,0.74,q.y));
         pt=max(pt,smoothstep(0.84,0.93,q.x)*smoothstep(0.45,0.6,q.y)); pt=max(pt,smoothstep(0.80,0.88,q.y)*step(0.62,q.x));
         diffuseColor.rgb=olho?vec3(0.25,0.62,0.95):mix(vec3(0.80,0.72,0.58),vec3(0.10,0.06,0.045),pt); }`)}})}

 'Disciplina':BARNEY['Disciplina'].concat(['Faça a coisa difícil cedo, antes que o dia invente desculpas.','Combine o novo hábito com um velho: depois do café, 10 agachamentos. Hábito pega carona.','Feito é melhor que perfeito. Um treino de 20 minutos vale mais que o de 1 hora que não aconteceu.','Disciplina também é saber parar. Descanso planejado faz parte do plano.','Diga a regra em voz alta: "eu sou alguém que treina". Identidade sustenta o que a força de vontade não aguenta.','Reduza a fricção: garrafa cheia na mesa, tênis perto da porta, celular longe da cama.','Celebre o pequeno: marcar a missão do dia é um voto a favor de quem você quer ser.']),
 'Filosofia':BARNEY['Filosofia'].concat(['Para Epicuro, a felicidade mora em coisas simples: amigos, conversa, pão, sossego. Talvez você já tenha mais do que percebe.','Heráclito dizia que ninguém entra duas vezes no mesmo rio. Você também muda todo dia; não se prenda a quem foi ontem.','Montaigne escreveu que a maior coisa do mundo é saber ser de si mesmo. Tire um tempo só seu hoje.','Simone de Beauvoir lembrava que a gente se torna quem é, não nasce pronta. Você está se fazendo agora.','Sêneca: enquanto adiamos, a vida passa. Viva o que dá para viver hoje.','Os estoicos treinavam imaginar perder o que têm, para valorizar o que têm. Olhe para os seus gatos agora.','Kierkegaard dizia que a vida se entende olhando para trás, mas se vive olhando para a frente. Dê o próximo passo mesmo sem entender tudo.','Lao Tsé: a jornada de mil quilômetros começa com um passo. O seu programa de 24 semanas também.']),
 'Tristeza':BARNEY['Tristeza'].concat(['Chorar não é fraqueza, é o corpo descarregando. Depois, beba água.','Abra a janela, pegue um pouco de sol. Luz de manhã ajuda o humor mais do que parece.','Mande mensagem para alguém de quem você gosta. Não precisa explicar nada.','Dias cinzas passam. Você não precisa gostar deles, só atravessar.','Ouvir uma música que você ama é um remédio pequeno e válido.','Seja gentil com o seu ritmo hoje. Metade do plano já é muito.']),
 'Raiva':BARNEY['Raiva'].concat(['Escreva tudo o que sente, sem filtro, e não envie. Depois decida com calma.','Raiva é energia. Gaste em algo útil: treino, faxina, caminhada rápida.','Antes de responder, pergunte: eu quero ter razão ou quero resolver?','Diga "eu me senti..." em vez de "você sempre...". A conversa muda de lado.','Se for na hora, aperte as mãos com força por 5 segundos e solte. O corpo solta junto.','Dormir sobre o assunto quase sempre deixa a resposta melhor.']),
 'Foco':BARNEY['Foco'].concat(['Defina a única coisa que, feita hoje, faz o dia valer a pena.','Feche as abas que não são da tarefa. Cada aba aberta é um gato pedindo atenção.','Use o timer da aba Foco: 25 minutos de trabalho, 5 de pausa. Repetir 4 vezes já muda o dia.','Água e lanche antes de estudar. Cérebro com fome distrai fácil.','Estude explicando em voz alta, como se ensinasse alguém. O que você explica, você aprende.','Comece mesmo sem vontade. A concentração costuma chegar uns 10 minutos depois.'])});
const BBAG={};// "saco" de conselhos por tema: só repete depois de usar todos
barneyConselho=function(cat){cat=cat||BTOP||barneyAuto();BTOP=cat;let b=BBAG[cat];if(!b||!b.length){b=BBAG[cat]=BARNEY[cat].map((_,i)=>i).sort(()=>Math.random()-.5)}return BARNEY[cat][b.pop()]};
// balão da cena: vai passando por todos os temas, trocando a cada atualização
let BFALA=null,BFALAT=0;
tFala=function(T){const base=_tFalaB(T);if(/fome|banho|missões|orgulhoso/.test(base))return base;if(!BFALA||Date.now()-BFALAT>45000){const cats=Object.keys(BARNEY);const c=cats[Math.floor(Math.random()*cats.length)];let b=BBAG['_'+c];if(!b||!b.length)b=BBAG['_'+c]=BARNEY[c].map((_,i)=>i).sort(()=>Math.random()-.5);BFALA=BARNEY[c][b.pop()];BFALAT=Date.now()}return BFALA};

// leitor do texto colado
function qzLer(txt,gab){txt=(txt||'').replace(/\r/g,'').replace(/[ \t]+/g,' ');const out=[];const re=/\(\s*([A-E])\s*\)/g;let m,marks=[];while((m=re.exec(txt)))marks.push({l:m[1],i:m.index,f:re.lastIndex});
  let ini=0;for(let k=0;k<marks.length;k++){if(marks[k].l!=='A')continue;const g=marks.slice(k,k+5);if(g.length<5||g.map(x=>x.l).join('')!=='ABCDE')continue;
    let en=txt.slice(ini,g[0].i).trim();let num=null;const nms=[...en.matchAll(/(?:^|\n)[ \t]*(?:quest[ãa]o[ \t]*)?(\d{1,3})[ \t]*[\.\-–):]?[ \t]*(?:\n|(?=\S))/gi)];const nm=nms[nms.length-1];if(nm&&en.slice(nm.index+nm[0].length).trim().length>4){num=+nm[1];en=en.slice(nm.index+nm[0].length)}
    en=en.replace(/^(gabarito|resposta|resp)\s*:?\s*[A-E]\b\s*/i,'').trim();
    const ops=[];for(let j=0;j<5;j++){let fim=j<4?g[j+1].i:txt.length;let t=txt.slice(g[j].f,fim);if(j===4){const corte=t.search(/\n\s*\n|\n\s*(gabarito|resposta|resp)\s*:|\n\s*(?:quest[ãa]o\s*)?\d{1,3}\s*[\.\-–):]?\s/i);if(corte>=0)t=t.slice(0,corte)}ops.push(t.replace(/\s*\n\s*/g,' ').trim())}
    let after=txt.slice(g[4].f,(marks.slice(k+5).find(x=>x.l==='A')||{i:txt.length}).i);const gm=after.match(/(gabarito|resposta|resp)\s*:?\s*([A-E])\b/i);
    const e4=ops[4];ini=g[4].f+(txt.slice(g[4].f).indexOf(e4)+e4.length);if(gm)ini=Math.max(ini,g[4].f+after.indexOf(gm[0])+gm[0].length);
    if(en.length<5||ops.some(o=>!o))continue;out.push({num,e:en.replace(/\s*\n\s*/g,' '),o:ops,c:gm?'ABCDE'.indexOf(gm[2].toUpperCase()):-1})}
  // gabarito separado: "1-C 2-A", "1C 2A" ou só as letras em ordem "CAEBD"
  const G=(gab||'').toUpperCase();const pares=[...G.matchAll(/(\d{1,3})\s*[\-–.:)]?\s*([A-E])\b/g)];
  if(pares.length){const mp={};pares.forEach(p=>mp[+p[1]]=p[2]);out.forEach((q,k)=>{const l=mp[q.num!=null?q.num:k+1];if(l)q.c='ABCDE'.indexOf(l)})}
  else{const letras=G.replace(/[^A-E]/g,'');if(letras.length)out.forEach((q,k)=>{if(letras[k])q.c='ABCDE'.indexOf(letras[k])})}
  return out}

function agFala(t){const D=agD();if(!D.voz)return;try{const u=new SpeechSynthesisUtterance(String(t));u.lang='pt-BR';u.rate=1.15;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function agBip(f,d){try{beep(f,d||.08,.22)}catch(e){}}
function agSeries(){return AGP[agD().plano]}
function agFeitas(){const s=agSeries();let n=0;for(let i=0;i<AG.si;i++)n+=s[i];return n+AG.rep}
async function agWake(on){try{if(on&&navigator.wakeLock&&!AG.wl)AG.wl=await navigator.wakeLock.request('screen');if(!on&&AG.wl){AG.wl.release();AG.wl=null}}catch(e){}}
function agIniciar(){const D=agD();Object.assign(AG,{fase:'prep',rep:0,si:0,t0:performance.now(),fim:performance.now()+3000,pausa:null});agFala('Prepare-se');agWake(true);agLoop();render()}
function agLoop(){clearInterval(AG.tick);AG.tick=setInterval(()=>{if(AG.pausa)return;const now=performance.now(),D=agD(),T=D.tempo*1000,s=agSeries();
  if(AG.fase==='prep'){const r=Math.ceil((AG.fim-now)/1000);if(r!==AG.ult){AG.ult=r;if(r>0){agBip(660);agUI()}}if(now>=AG.fim){AG.fase='serie';AG.t0=now;AG.rep=0;agBip(990,.15);agFala('Vai!');render()}return}
  if(AG.fase==='serie'){const k=Math.floor((now-AG.t0)/T);const ph=((now-AG.t0)%T)/T;
    if(ph>.6&&AG.marca!==k){AG.marca=k;agBip(520,.05)}// hora de subir
    if(k>AG.rep){AG.rep=k;agBip(880,.07);agFala(AG.rep);agSalvaParcial();
      if(AG.rep>=s[AG.si]){if(AG.si>=s.length-1){agConcluir();return}AG.fase='desc';AG.fim=now+D.desc*1000;agFala('Descanso');render();return}}
    agUI();return}
  if(AG.fase==='desc'){const r=Math.ceil((AG.fim-now)/1000);if(r!==AG.ult){AG.ult=r;if(r<=3&&r>0)agBip(660);agUI()}if(now>=AG.fim){AG.si++;AG.rep=0;AG.fase='serie';AG.t0=now;AG.marca=-1;agBip(990,.15);agFala('Série '+(AG.si+1));render()}}},80)}
function agSalvaParcial(){const D=agD(),k=dkey(new Date());D.dias[k]=Math.max(D.dias[k]||0,(D.base||0)+agFeitas());save()}
function agConcluir(){clearInterval(AG.tick);AG.fase='fim';agWake(false);const D=agD(),k=dkey(new Date());D.dias[k]=Math.max(D.dias[k]||0,(D.base||0)+agFeitas());
  let ganho=0;if(!D.xpDias[k]){D.xpDias[k]=1;ganho=10;D.xp+=10}save();agBip(1320,.3);agFala('Sessenta! Parabéns!');AG.ganho=ganho;render()}
function agPausar(){if(AG.pausa){const dt=performance.now()-AG.pausa;AG.t0+=dt;AG.fim+=dt;AG.pausa=null;agFala('Continuando')}else{AG.pausa=performance.now();agFala('Pausa')}render()}
function agPular(){if(AG.fase==='desc')AG.fim=performance.now()}
function agMais(s){if(AG.fase==='desc'){AG.fim+=s*1000;agUI()}}
function agParar(){clearInterval(AG.tick);agWake(false);if(agFeitas()>0)agSalvaParcial();AG.fase='pronto';AG.pausa=null;render()}
function agSet(k,v){const D=agD();D[k]=v;save();render()}
function agUI(){const n=agFeitas(),s=agSeries(),tot=s.reduce((a,b)=>a+b,0);const big=document.getElementById('agBig'),sub=document.getElementById('agSub'),bar=document.getElementById('agBar');if(!big)return;const now=performance.now();
  if(AG.fase==='prep'){big.textContent=Math.max(1,Math.ceil((AG.fim-now)/1000));sub.textContent='prepare-se, pegue o peso'}
  else if(AG.fase==='serie'){big.textContent=AG.rep;sub.textContent=`série ${AG.si+1} de ${s.length} · ${AG.rep}/${s[AG.si]}`+(((now-AG.t0)%(agD().tempo*1000))/(agD().tempo*1000)<.6?' · desce':' · sobe')}
  else if(AG.fase==='desc'){big.textContent=Math.max(0,Math.ceil((AG.fim-now)/1000));sub.textContent=`descanso · próxima: série ${AG.si+2} de ${s.length}`}
  if(bar)bar.style.width=Math.round(100*n/tot)+'%';const tt=document.getElementById('agTot');if(tt)tt.textContent=`${n} de ${tot}`}
function vAgachar(){const D=agD(),s=agSeries(),tot=s.reduce((a,b)=>a+b,0),k=dkey(new Date()),hoje=D.dias[k]||0;const rodando=['prep','serie','desc'].includes(AG.fase);
  const dias=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const kk=dkey(d),v=D.dias[kk]||0;return `<div class="agd ${v>=60?'ok':v?'meio':''}"><b>${v>=60?'✓':v||'·'}</b><small>${['D','S','T','Q','Q','S','S'][d.getDay()]}</small></div>`}).join('');
  let seq=0;for(let i=0;;i++){const d=new Date();d.setDate(d.getDate()-i);const v=D.dias[dkey(d)]||0;if(v>=60)seq++;else if(i>0)break;if(i>400)break}
  const opc=(chave,lista,fmt)=>`<div class="agop">${lista.map(v=>`<button class="${D[chave]==v?'on':''}" ${rodando?'disabled':''} onclick="agSet('${chave}',${typeof v==='string'?`'${v}'`:v})">${fmt(v)}</button>`).join('')}</div>`;
  return `<header class="ph"><h1>60 agachamentos</h1><p class="muted">Agachamento com o pesinho junto ao peito (taça). Aperte Iniciar: o app conta sozinho no ritmo escolhido e dá o descanso entre as séries.</p></header>
   <section class="agcard"><div id="ag3d" class="ag3d"></div>
    <div class="agnum"><b id="agBig">${AG.fase==='fim'?'60':AG.fase==='pronto'?hoje:AG.rep}</b><span id="agSub">${AG.fase==='fim'?'feito! 🎉'+(AG.ganho?` +${AG.ganho} XP`:''):AG.fase==='pronto'?'agachamentos hoje':''}</span></div>
    <div class="agbar"><i id="agBar" style="width:${AG.fase==='fim'?100:Math.round(100*agFeitas()/tot)}%"></i></div><p class="muted" id="agTot" style="text-align:center;margin:4px 0 10px;font-size:12.5px">${agFeitas()} de ${tot}</p>
    ${rodando?`<div class="agbtns"><button class="go" onclick="agPausar()">${AG.pausa?'▶ Continuar':'⏸ Pausar'}</button>${AG.fase==='desc'?`<button class="mini" onclick="agMais(15)">+15 s</button><button class="mini" onclick="agPular()">Pular descanso</button>`:''}<button class="mini warn" onclick="agParar()">Encerrar</button></div>`
     :`<button class="go agstart" onclick="agIniciar()">${AG.fase==='fim'?'Fazer de novo':'▶ Iniciar'}</button>`}</section>
   <section class="agcard"><h3>Como fazer</h3>${opc('plano',Object.keys(AGP),v=>v.replace('x',' × '))}
    <p class="aglab">Ritmo de cada agachamento</p>${opc('tempo',[2,3,4],v=>v+' s'+(v===3?' (2 desce, 1 sobe)':''))}
    <p class="aglab">Descanso entre as séries</p>${opc('desc',[20,30,45,60],v=>v+' s')}
    <div class="agrow"><label>Peso <input type="text" inputmode="decimal" value="${esc(D.peso||'')}" placeholder="ex.: 4 kg" onchange="agSet('peso',this.value)"></label><label class="agvoz"><input type="checkbox" ${D.voz?'checked':''} onchange="agSet('voz',this.checked)"> contar em voz alta</label></div>
    <details class="pall"><summary>Técnica do agachamento com peso</summary><ol class="rtxt"><li>Segure o peso junto ao peito, cotovelos para baixo.</li><li>Pés na largura dos ombros, pontas levemente para fora.</li><li>Desça levando o quadril para trás, como se fosse sentar, até as coxas ficarem paralelas ao chão.</li><li>Joelhos na direção das pontas dos pés, sem fechar para dentro. Calcanhar no chão.</li><li>Suba empurrando o chão, apertando o glúteo no topo. Respire: solta o ar na subida.</li></ol></details></section>
   <section class="agcard"><h3>Últimos 7 dias</h3><div class="agdias">${dias}</div><p class="muted" style="font-size:12.5px;margin:8px 0 0">${seq?`🔥 ${seq} ${seq===1?'dia':'dias'} seguidos com 60.`:'Faça 60 hoje para começar a sequência.'} Completar 60 no dia vale +10 XP.</p></section>`}

const A3={ren:null,canvas:null,scene:null,cam:null,raf:0};
async function agMount3d(box){try{await v3Load()}catch(e){return}const T=V3.T;if(!A3.ren){A3.canvas=document.createElement('canvas');A3.ren=new T.WebGLRenderer({canvas:A3.canvas,antialias:true,alpha:true});A3.ren.outputColorSpace=T.SRGBColorSpace;A3.ren.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
    A3.scene=new T.Scene();A3.scene.add(new T.HemisphereLight(0xffffff,0x8a6a55,2.1));const d=new T.DirectionalLight(0xffffff,1.6);d.position.set(1.5,3,3);A3.scene.add(d);A3.cam=new T.PerspectiveCamera(28,1,.1,50);
    const ch=new T.Mesh(new T.CircleGeometry(.7,40),new T.MeshBasicMaterial({color:0,transparent:true,opacity:.12}));ch.rotation.x=-Math.PI/2;A3.scene.add(ch)}
  if(!A3.act){try{const buf=await v3Bytes('agachamento.glb');const g=await new Promise((ok,err)=>v3Loader(V3.GL).parse(buf,'',ok,err));const clip=g.animations[0];clip.tracks.forEach(t=>{t.name=t.name.replace(/^mixamorig\d*/,'')});A3.mix=V3.mixer||(V3.mixer=new T.AnimationMixer(V3.model));A3.act=A3.mix.clipAction(clip);A3.dur=clip.duration}catch(e){}}
  if(!box.isConnected)return;box.innerHTML='';box.appendChild(A3.canvas);A3.scene.add(V3.model);V3.model.position.set(0,0,0);
  cancelAnimationFrame(A3.raf);const tick=now=>{if(!A3.canvas.isConnected)return;const w=A3.canvas.clientWidth,h=A3.canvas.clientHeight;if(A3.canvas.width!==Math.round(w*A3.ren.getPixelRatio())){A3.ren.setSize(w,h,false);A3.cam.aspect=w/h;A3.cam.updateProjectionMatrix()}
    A3.cam.position.set(2.2,1.2,3.6);A3.cam.lookAt(0,.8,0);let f;
    if(AG.fase==='serie'&&!AG.pausa){const T2=agD().tempo*1000,ph=((now-AG.t0)%T2)/T2;const d=ph<.6?Math.sin(ph/.6*Math.PI/2):Math.cos((ph-.6)/.4*Math.PI/2);
      if(A3.act){// animação de verdade (Mixamo): começo do clipe = agachada, fim = em pé
        if(V3.run&&V3.run.isRunning())V3.run.stop();A3.act.enabled=true;if(!A3.act.isRunning())A3.act.play();A3.act.time=(1-d)*A3.dur*.98;A3.mix.update(0);
        V3.B.Hips.position.x=V3.hips0.x;V3.B.Hips.position.z=V3.hips0.z;V3.model.rotation.y=0;A3.ren.render(A3.scene,A3.cam);A3.raf=requestAnimationFrame(tick);return}
      f=V3ANIM.agachar(d)}
    if(A3.act&&A3.act.isRunning())A3.act.stop();
    else if(AG.fase==='fim')f=V3ANIM.comemorar(now/1000);else if(AG.fase==='prep')f=V3ANIM.alongar(now/1000);else f=V3ANIM.idle(now/1000);
    v3Pose(f.P,f.y);V3.model.rotation.y=0;A3.ren.render(A3.scene,A3.cam);A3.raf=requestAnimationFrame(tick)};A3.raf=requestAnimationFrame(tick)}

['Bancários','Um aumento da alíquota do recolhimento compulsório sobre depósitos tende a:',['aumentar a oferta de crédito','reduzir a liquidez do sistema e a oferta de crédito','reduzir a taxa Selic automaticamente','aumentar a base monetária','elevar os depósitos à vista'],1,'Com mais recursos retidos no BC, os bancos têm menos dinheiro para emprestar: medida contracionista.'],
['Bancários','Quando o Banco Central compra títulos públicos no mercado aberto, o efeito esperado é:',['contração da liquidez','aumento da liquidez da economia','aumento do compulsório','valorização do real','redução da base monetária'],1,'Ao comprar títulos, o BC paga com moeda e injeta dinheiro no sistema (política expansionista).'],

['Bancários','A Circular BCB nº 3.978/2020 dispõe sobre:',['o funcionamento do Pix','a política, os procedimentos e os controles internos para prevenção à lavagem de dinheiro e ao financiamento do terrorismo','as regras do cheque especial','o seguro-desemprego','o Open Finance'],1,'A Circular 3.978/2020 trata de PLD/FT: conhecer o cliente, monitorar operações e comunicar suspeitas ao COAF.'],
['Bancários','A garantia pessoal prestada em um título de crédito, como a nota promissória, chama-se:',['fiança','aval','hipoteca','penhor','alienação fiduciária'],1,'Aval é a garantia própria dos títulos de crédito. Fiança é garantia de contratos; hipoteca, penhor e alienação fiduciária são garantias reais.'],
['Bancários','A taxa de câmbio PTAX, divulgada pelo Banco Central, corresponde:',['à cotação de abertura do dólar','à média das taxas de câmbio apuradas em consultas ao longo do dia','à taxa máxima permitida pelo CMN','à cotação do dólar turismo','à taxa fixada pelo Tesouro'],1,'A PTAX é calculada pelo BC com base na média das cotações coletadas em janelas de consulta durante o dia.'],
['Bancários','O prazo para apresentação de um cheque emitido na mesma praça de pagamento é de:',['15 dias','30 dias','60 dias','90 dias','180 dias'],1,'Pela Lei do Cheque (7.357/1985), são 30 dias na mesma praça e 60 dias em praça diferente.'],
['Bancários','Sobre a LCI, é correto afirmar que:',['é lastreada em créditos do agronegócio','é isenta de IR para pessoa física e lastreada em créditos imobiliários','não tem garantia do FGC','é emitida apenas pelo Tesouro Nacional','é um título de renda variável'],1,'LCI = Letra de Crédito Imobiliário: lastro imobiliário, isenta de IR para PF e com garantia do FGC. A LCA é a do agronegócio.'],

['Informática','O tipo de código malicioso que criptografa os arquivos da vítima e exige pagamento para liberá-los é o:',['spyware','adware','ransomware','worm','keylogger'],2,'Ransomware sequestra os dados (criptografa) e pede resgate.'],

['Português','Assinale a frase em que a colocação do pronome está de acordo com a norma-padrão.',['Far-se-á a reunião amanhã.','Me disseram que a reunião foi adiada.','Não informaram-nos sobre a mudança.','Quem avisou-te?','Tudo resolveu-se rapidamente.'],0,'Com verbo no futuro do presente e sem palavra atrativa, usa-se a mesóclise. "Não", "quem" e "tudo" atraem o pronome (próclise).'],
['Português','Assinale a frase com ERRO de pontuação.',['Ontem, o gerente chegou cedo.','O cliente que chegou cedo, foi atendido primeiro.','Senhores, a agência fechará às 16h.','Quando o sistema voltou, todos comemoraram.','O banco, que tem cem anos, mudou de logo.'],1,'Não se separa o sujeito ("O cliente que chegou cedo") do verbo ("foi atendido") com vírgula.'],
['Português','Em "As vendas subiram; contudo, a margem de lucro caiu", a palavra "contudo" pode ser substituída, sem mudar o sentido, por:',['portanto','porque','no entanto','assim','pois'],2,'"Contudo" indica oposição, como "no entanto", "porém" e "todavia". "Portanto" e "assim" indicam conclusão.'],
['Português','A frase "O banco aprovou o crédito" na voz passiva analítica fica:',['Aprovou-se o crédito.','O crédito foi aprovado pelo banco.','O crédito aprovou o banco.','O crédito está aprovando.','Aprovaram o crédito.'],1,'Voz passiva analítica = ser + particípio: "foi aprovado pelo banco". "Aprovou-se o crédito" é a passiva sintética.'],
['Português','Complete corretamente: "A agência ___ endereço mudou reabrirá amanhã."',['que o','cujo o','cujo','onde o','a qual'],2,'"Cujo" indica posse e não admite artigo depois dele: "cujo endereço".'],
['Português','Assinale a frase correta quanto à concordância nominal.',['É proibida entrada de estranhos.','É proibida a entrada de estranhos.','É proibido a entrada de estranhos.','São proibido entradas.','É proibidas a entrada.'],1,'Com artigo ("a entrada"), o adjetivo concorda: "proibida". Sem artigo, ficaria "É proibido entrada".'],
['Português','Em "O diretor foi taxativo ao negar o pedido", a palavra "taxativo" significa:',['hesitante','categórico','educado','irônico','confuso'],1,'Taxativo = que não admite contestação; categórico, firme.'],

<meta name="theme-color" content="#FFF4E8"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#20263F;--sf:#2A3152;--sf2:#333B61;--ln:#434C77;--tx:#F4F2FA;--mu:#A9AECB;--pe:#FFB48F;--pe2:#FF9A6B;--li:#C3B5FF;--mi:#8FE3C8;--bad:#FF8FA3;--sh:0 10px 30px rgba(8,10,26,.35)}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F6F4FB;--sf:#FFFFFF;--sf2:#EFEBFA;--ln:#DDD8EE;--tx:#20263F;--mu:#6B7094;--pe:#F2875A;--pe2:#E56F3F;--li:#7C66E8;--mi:#2BA981;--bad:#D6475F;--sh:0 10px 28px rgba(32,38,63,.10)}}
:root[data-theme="light"]{--bg:#F6F4FB;--sf:#FFFFFF;--sf2:#EFEBFA;--ln:#DDD8EE;--tx:#20263F;--mu:#6B7094;--pe:#F2875A;--pe2:#E56F3F;--li:#7C66E8;--mi:#2BA981;--bad:#D6475F;--sh:0 10px 28px rgba(32,38,63,.10);color-scheme:light}
:root[data-theme="dark"]{--bg:#20263F;--sf:#2A3152;--sf2:#333B61;--ln:#434C77;--tx:#F4F2FA;--mu:#A9AECB;--pe:#FFB48F;--pe2:#FF9A6B;--li:#C3B5FF;--mi:#8FE3C8;--bad:#FF8FA3;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,b,.big b,.rv b,.tap b{font-family:"Sora","Manrope",system-ui,sans-serif}
h1{font-size:24px;line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}h2{font-size:17px;margin:0;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--li);outline-offset:2px}
input{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;min-width:0}
.muted{color:var(--mu)}small{font-size:12.5px}
main{max-width:520px;margin:0 auto;padding:18px 16px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)}
.tabs div{display:flex;max-width:520px;width:100%;justify-content:space-around}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 10px;border-radius:14px;color:var(--mu);font-size:11.5px;font-weight:600;min-width:58px}
.tabs button i{font-style:normal;font-size:19px;line-height:1.2;font-family:"Sora",sans-serif;font-weight:700}.tabs button.on{color:var(--tx);background:var(--sf)}.tabs button.on i{color:var(--pe)}
/* hoje */
.hero{display:flex;gap:16px;align-items:center;margin:6px 0 16px}
.av{position:relative;width:132px;height:132px;flex:none}.av img{position:absolute;inset:14px;width:104px;height:104px;border-radius:50%;object-fit:cover}.avring{position:absolute;inset:0}
.rg-bg,.rs-bg{stroke:var(--sf2)}.rg{stroke:var(--pe);transition:stroke-dashoffset .6s}.rs{stroke:var(--li)}
.hi{min-width:0}.hi h1{font-size:22px}.hi p{margin:0}.q{font-size:12.5px;color:var(--li);margin-top:4px!important}
.lvl{margin-top:10px}.lvl b{font-size:14px;margin-right:6px}.lvl span{font-size:13px;color:var(--pe)}.bar{height:6px;background:var(--sf2);border-radius:4px;margin:5px 0 3px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pe2),var(--pe));border-radius:4px}.lvl small{color:var(--mu)}
.daystat{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ln);border-radius:18px;overflow:hidden;margin-bottom:18px}
.daystat div{background:var(--sf);padding:12px 10px;text-align:center}.daystat b{display:block;font-size:19px}.daystat span{font-size:12px;color:var(--mu)}
.tl{list-style:none;margin:0;padding:0;position:relative}.tl::before{content:"";position:absolute;left:47px;top:8px;bottom:8px;width:2px;background:var(--ln)}
.tl li{display:grid;grid-template-columns:42px 1fr;gap:14px;margin-bottom:10px;position:relative}
.tl li::before{content:"";position:absolute;left:43px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--ln)}
.tl li.cur::before{border-color:var(--pe);background:var(--pe);box-shadow:0 0 0 5px color-mix(in srgb,var(--pe) 25%,transparent)}.tl li.done::before{border-color:var(--mi);background:var(--mi)}
.tl time{font:600 13px "Sora",sans-serif;padding-top:10px;text-align:right;color:var(--mu);line-height:1.2}.tl time small{display:block;font-weight:400;font-size:11px;opacity:.8}
.tl li.cur time{color:var(--pe)}
.card{background:var(--sf);border-radius:16px;padding:11px 12px 11px 12px;position:relative;margin-left:10px;border:1px solid transparent}
.tl li.cur .card{border-color:color-mix(in srgb,var(--pe) 55%,transparent);box-shadow:var(--sh)}.tl li.done .card{opacity:.62}
.row{display:flex;align-items:center;gap:10px}.ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--sf2);color:var(--li);font-size:15px;flex:none}
.k-treino .ic{color:var(--pe)}.k-sono .ic{color:#9fb4ff}.k-pele .ic,.k-cabelo .ic{color:#ffa9c9}.k-estudo .ic{color:var(--mi)}
.tt{flex:1;min-width:0}.tt b{display:block;font-size:14.5px;font-weight:600;font-family:"Manrope",sans-serif}.tt small{color:var(--mu);display:block}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-weight:800;color:var(--bg);flex:none;transition:.15s}
.done .chk{background:var(--mi);border-color:var(--mi)}
.xp{position:absolute;right:52px;top:13px;font-size:11px;color:var(--pe);font-weight:700;opacity:.85}.done .xp{color:var(--mi)}
.tm{display:flex;align-items:center;gap:10px;margin:10px 0 2px 40px}.play{width:38px;height:38px;border-radius:50%;background:var(--pe);color:#2a1d18;font-size:14px;font-weight:800}.play.on{background:var(--li);color:#1c1740}
.tmv{font:600 20px "Sora",sans-serif;font-variant-numeric:tabular-nums}.live{font-size:11px;color:var(--li);animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.35}}
.sleep{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:10px 0 0 40px;font-size:13px;color:var(--mu)}.sleep input{padding:5px 8px;margin-left:4px}.sleep b{color:var(--tx)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 40px}.steps button{font-size:12.5px;padding:5px 10px;border-radius:20px;border:1px solid var(--ln);color:var(--mu)}.steps button.on{background:color-mix(in srgb,var(--mi) 22%,transparent);border-color:var(--mi);color:var(--tx)}
.go{background:var(--pe);color:#2a1d18;font-weight:700;border-radius:12px;padding:9px 16px}.card .go{margin:10px 0 0 40px}
.foot{font-size:12.5px;margin-top:14px}
/* treino */
.ph{margin-bottom:14px}.ph .muted{margin:8px 0 0;font-size:13px}
.seg{display:flex;background:var(--sf);border-radius:14px;padding:4px;gap:4px;margin-top:10px}.seg button{flex:1;padding:8px 6px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--mu)}.seg button.on{background:var(--sf2);color:var(--tx)}
.plan{background:var(--sf);border-radius:22px;padding:14px;margin-bottom:14px}.pt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.exl{list-style:none;margin:0;padding:0}.exl li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--ln)}.exl li:first-child{border-top:0}
.exl b{font-family:"Manrope",sans-serif;font-weight:600;font-size:14px;display:block}.exl small{color:var(--mu)}
.ed{display:flex;gap:4px}.ed button{width:30px;height:30px;border-radius:9px;background:var(--sf2);font-weight:700}
svg.fig{display:block}svg.fig.sm{width:52px;height:52px;background:var(--sf2);border-radius:12px}
.fg{fill:none;stroke:var(--pe);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bk{fill:none;stroke:var(--li);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.45}.hd{fill:var(--pe)}.fl{stroke:var(--ln);stroke-width:3;stroke-linecap:round}
.sh{margin:22px 0 10px}.hist{list-style:none;margin:0;padding:0}.hist li{background:var(--sf);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;flex-direction:column;position:relative}.hist li span{color:var(--mu);font-size:13px;padding-right:24px}.hist b{font-family:"Manrope",sans-serif}
.hist .x{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:8px;color:var(--mu);font-size:18px}.empty{background:var(--sf);border-radius:14px;padding:14px;font-size:13.5px}
.ph .back{color:var(--pe);font-weight:700;margin-right:10px}
.dots{display:flex;gap:5px;margin:0 0 10px}.dots i{flex:1;height:5px;border-radius:3px;background:var(--sf2)}.dots i.ok{background:var(--mi)}.dots i.on{background:var(--pe)}
.ex{background:var(--sf);border-radius:26px;padding:10px 16px 16px;text-align:center}.ex h1{margin-top:4px}.ex p{margin:4px 0}.tg{font-weight:700;color:var(--pe)}
svg.fig.big{width:min(62vw,240px);height:min(62vw,240px);margin:0 auto}
.counter,.rest{margin-top:14px;text-align:center}.tap{width:100%;background:linear-gradient(160deg,var(--sf2),var(--sf));border:1px solid var(--ln);border-radius:26px;padding:22px 10px;display:flex;flex-direction:column;align-items:center;touch-action:manipulation}
.tap:active{transform:scale(.985)}.tap b{font-size:64px;line-height:1;font-variant-numeric:tabular-nums}.tap span{color:var(--mu);font-size:13px;margin-top:6px}
.rb{display:flex;gap:10px;justify-content:center;margin-top:12px}.rb button{padding:11px 16px;border-radius:14px;background:var(--sf);font-weight:600}.rb .go{background:var(--pe);color:#2a1d18;flex:1;max-width:240px}.rb button:disabled{opacity:.4}
.rest{position:relative}.rring{width:220px;height:220px;display:block;margin:0 auto}.rv{position:absolute;top:0;left:0;right:0;height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center}.rv b{font-size:56px;line-height:1}.rv span{color:var(--mu)}
/* timer */
.big{position:relative;width:240px;height:240px;margin:6px auto 4px}.big svg{width:240px;height:240px}.big b{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-variant-numeric:tabular-nums}.big span{position:absolute;left:0;right:0;bottom:62px;text-align:center;font-size:12.5px;color:var(--mu)}
.big.work b{color:var(--pe)}.big.rest b{color:var(--li)}
.presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}.presets button{padding:7px 12px;border-radius:20px;background:var(--sf);font-size:13px;font-weight:600}.presets button.on{background:var(--li);color:#1c1740}
.ivs{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}.ivs label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:4px}.ivs input{width:78px;text-align:center}
.laps{list-style:none;padding:0;margin:14px 0 0;max-height:220px;overflow:auto}.laps li{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--ln)}.laps b{font-variant-numeric:tabular-nums}
/* corpo */
.meas{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}.m{background:var(--sf);border-radius:16px;padding:10px;text-align:left;display:flex;flex-direction:column;border:1.5px solid transparent;position:relative}
.m.on{border-color:var(--pe)}.m span{font-size:12px;color:var(--mu)}.m b{font-size:20px}.m b small{font-size:11px;color:var(--mu);margin-left:2px;font-weight:500}.m em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--mu)}.m em.good{color:var(--mi)}.m em.bad{color:var(--bad)}
.chart{background:var(--sf);border-radius:22px;padding:14px;margin-top:12px}.chart svg{width:100%;height:auto;margin-top:6px}
.line{fill:none;stroke:var(--pe);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.area{fill:color-mix(in srgb,var(--pe) 16%,transparent);stroke:none}.pt{fill:var(--bg);stroke:var(--pe);stroke-width:2.5}
.lb{font:600 10px "Sora",sans-serif;fill:var(--tx)}.ax{font-size:9.5px;fill:var(--mu)}.ctx{font-size:13px;fill:var(--mu)}
.add{background:var(--sf);border-radius:18px;margin-top:12px;padding:4px 14px}.add summary{padding:10px 0;font-weight:700;cursor:pointer;color:var(--pe)}
.add form{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:14px}.add label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mu);gap:4px}.add label span{display:flex;align-items:center;gap:6px;color:var(--mu)}.add input{width:100%}.add .go{grid-column:1/-1;padding:12px}
/* eu */
.me{display:flex;gap:16px;align-items:flex-end;background:linear-gradient(180deg,var(--sf2),var(--sf));border-radius:26px;padding:16px 16px 0;overflow:hidden}.me img{width:120px;height:auto;display:block;margin-bottom:-2px}.me div{padding-bottom:18px}.me p{margin:2px 0}
.badges{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}.badges li{background:var(--sf);border-radius:14px;padding:10px 12px;color:var(--mu);font-size:13.5px;display:flex;gap:8px;align-items:center}.badges li.on{color:var(--tx)}.badges li span{color:var(--mu);font-size:16px}.badges li.on span{color:var(--pe)}
.set{background:var(--sf);border-radius:18px;padding:6px 14px}.set label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:14px}.set label:last-child{border-bottom:0}
.set input[type=time],.set input[type=number]{width:auto}.set input[name=name]{width:55%}.set label span{display:flex;align-items:center;gap:6px}.set input[type=number]{width:70px}
.sw input{width:22px;height:22px;accent-color:var(--pe)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translate(-50%,20px);opacity:0;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;transition:.25s;pointer-events:none;z-index:9}#toast.on{opacity:1;transform:translate(-50%,0)}

.dnav{display:flex;align-items:center;justify-content:space-between;background:var(--sf);border-radius:18px;padding:6px;margin-bottom:12px}
.dnav button{width:40px;height:40px;border-radius:12px;font-size:24px;color:var(--pe);background:var(--sf2)}.dnav button:disabled{opacity:.25}
.dnav div{text-align:center}.dnav b{display:block;font-size:17px}.dnav span{font-size:12.5px;color:var(--li)}
.av::after{content:"";position:absolute;inset:8px;border-radius:50%;border:2px solid var(--tier);opacity:.9;pointer-events:none}
.flame{font-size:19px}
.mcard{display:block;width:100%;text-align:left;background:linear-gradient(135deg,color-mix(in srgb,var(--li) 26%,var(--sf)),var(--sf));border-radius:22px;padding:14px 16px;margin-bottom:16px;border:1px solid color-mix(in srgb,var(--li) 35%,transparent)}
.mcard p{margin:4px 0 6px;font:600 16px/1.4 "Sora",sans-serif}.mc-c{font-size:12px;font-weight:700;color:var(--li)}.mcard small{color:var(--mu)}
.ro{font-size:12.5px;color:var(--mu);background:var(--sf);border-radius:12px;padding:8px 12px}.tl.lock .chk{opacity:.5;cursor:default}
.cnt{display:flex;align-items:center;gap:10px;margin:10px 0 0 40px}.cnt button{width:34px;height:34px;border-radius:10px;background:var(--sf2);font-weight:800;font-size:18px}.cbar{flex:1;height:8px;background:var(--sf2);border-radius:5px;overflow:hidden}.cbar i{display:block;height:100%;background:linear-gradient(90deg,#6ec6ff,var(--mi))}.cnt b{font-size:14px;min-width:34px}
.refl{background:var(--sf);border-radius:20px;padding:14px;margin-top:6px}.moods{display:flex;justify-content:space-between;margin:10px 0}.moods button{font-size:28px;width:52px;height:52px;border-radius:16px;background:var(--sf2);filter:grayscale(.7);opacity:.7}.moods button.on{filter:none;opacity:1;outline:2px solid var(--pe)}
textarea{width:100%;min-height:70px;font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:10px;resize:vertical}
.lnk{color:var(--pe);font-weight:700;font-size:13px;padding:4px 0}
.jr{display:flex;gap:14px;align-items:center;background:var(--sf);border-radius:24px;padding:14px}.big66{width:108px;height:108px;flex:none;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--pe) 40%,var(--sf2)),var(--sf2));border:2px solid var(--pe)}
.big66 b{font-size:40px;line-height:1}.big66 span{font-size:12px;color:var(--mu)}.jst{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px}.jst b{display:block;font-size:18px}.jst span{font-size:11.5px;color:var(--mu)}
.map{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:14px}.map .c{aspect-ratio:1;border-radius:7px;font-size:9.5px;font-weight:700;color:transparent;background:var(--sf);position:relative}
.map .c.alt{background:color-mix(in srgb,var(--sf) 70%,var(--sf2))}.map .c.l1{background:color-mix(in srgb,var(--pe) 25%,var(--sf))}.map .c.l2{background:color-mix(in srgb,var(--pe) 55%,var(--sf))}.map .c.l3{background:color-mix(in srgb,var(--pe) 80%,var(--sf))}.map .c.l4{background:var(--pe)}
.map .c.lf{opacity:.45}.map .c:disabled{cursor:default}.map .c.now{outline:2px solid var(--li);outline-offset:1px;color:var(--tx)}.map .c:hover:not(:disabled){color:var(--tx)}
.legend{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--mu);margin:8px 0 0;flex-wrap:wrap}.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;background:var(--sf);margin-right:2px}.legend .l1{background:color-mix(in srgb,var(--pe) 25%,var(--sf))}.legend .l2{background:color-mix(in srgb,var(--pe) 55%,var(--sf))}.legend .l4{background:var(--pe)}
.phases{list-style:none;padding:0;margin:0}.phases li{background:var(--sf);border-radius:16px;padding:10px 14px;margin-bottom:8px;border-left:4px solid var(--ln)}.phases li.on{border-left-color:var(--pe)}.phases b{display:block;font-family:"Manrope",sans-serif}.phases span{font-size:13px;color:var(--mu)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.modes button{text-align:left;background:var(--sf);border-radius:18px;padding:12px;border:1.5px solid transparent}.modes button.on{border-color:var(--pe)}.modes b{display:block;font-size:15px}.modes span{font-size:12.5px;color:var(--mu)}
.cen{text-align:center;font-size:13px;margin-top:14px}
.breath{position:relative;width:260px;height:260px;margin:10px auto;display:grid;place-items:center}.orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--li) 70%,white),color-mix(in srgb,var(--li) 55%,var(--bg)));transform:scale(.55);transition:transform .2s linear;box-shadow:0 0 60px color-mix(in srgb,var(--li) 45%,transparent)}
.breath b{position:relative;font-size:20px;color:#1c1740}

:root,:root[data-theme="light"]{--bg:#FFF4E8;--sf:#FFFFFF;--sf2:#F6EBDD;--ln:#E9DCCB;--tx:#2A2230;--mu:#7C7079;--pe:#FF9B6A;--pe2:#F07A45;--li:#8C78E8;--mi:#7FA85F;--sky:#CFE6F5;--sage:#B7CFA4;--bad:#E25C74;--ol:#2A2230;--sh:3px 4px 0 var(--ol);color-scheme:light}

<script src="vida-imagens.js"></script><script src="vida-exercicios.js"></script><script src="vida-sons-1.js"></script><script src="vida-sons-2.js"></script><script>
/* ================= JOGO DA VIDA ================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const toMin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b},toHM=m=>pad(Math.floor(m/60)%24)+':'+pad(Math.round(m%60));
const fmtDur=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h${pad(m)}`:`${pad(m)}:${pad(x)}`};
const fmtHm=min=>{min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h?`${h}h${m?pad(m):''}`:`${m} min`};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- estado ---------- */
const DEF={v:1,name:'',theme:'dark',gymMode:'academia',sleepGoal:7,studyGoal:60,wakeQ1:'06:00',wakeQ2:'07:00',bed:'23:00',workSat:false,days:{},body:[],history:[],plans:null};
let S=JSON.parse(JSON.stringify(DEF));let DB=null,UID=null,saveT=null;
function day(k){k=k||dkey(new Date());return S.days[k]||(S.days[k]={done:{},timers:{},sleep:{}})}
function save(){try{localStorage.setItem('jogo-da-vida',JSON.stringify(S))}catch(e){}clearTimeout(saveT);saveT=setTimeout(async()=>{if(DB&&UID){try{await DB.doc('data/users/'+UID+'/vida/estado').set({json:JSON.stringify(S),at:Date.now()})}catch(e){}}},700)}
async function boot(){try{const l=localStorage.getItem('jogo-da-vida');if(l)S=Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(l))}catch(e){}
  if(!S.plans)S.plans=defaultPlans();applyTheme();render();
  try{const c=window.claude;if(!c||!c.use)return;const [db,user]=await Promise.all([c.use('db'),c.use('user')]);if(!db||!user)return;UID=await user.id();if(!UID)return;DB=db;
    const snap=await db.doc('data/users/'+UID+'/vida/estado').get();if(snap&&snap.exists){const d=snap.data();const r=JSON.parse(d.json||'{}');const localAt=+(localStorage.getItem('jogo-da-vida-at')||0);if(d.at>=localAt){S=Object.assign(JSON.parse(JSON.stringify(DEF)),r);if(!S.plans)S.plans=defaultPlans();applyTheme();render()}}else save();
  }catch(e){}}
const _save=save;save=function(){try{localStorage.setItem('jogo-da-vida-at',Date.now())}catch(e){}_save()};
/* ---------- XP e nível ---------- */
const TITLES=['Começando','Firme','Focada','Disciplinada','Imparável','Lendária'];
function dayXP(k){const d=S.days[k];if(!d)return 0;let x=0;for(const b of buildDay(new Date(k+'T12:00:00')))if(d.done[b.id])x+=b.xp;const st=(d.timers.estudo||{}).total||0;x+=Math.min(120,Math.floor(st/60));return x+readBonus(k)}
function totalXP(){return Object.keys(S.days).reduce((a,k)=>a+dayXP(k),0)+S.history.length*10}
function level(xp){let l=1,need=300,acc=0;while(xp>=acc+need){acc+=need;l++;need=Math.round(need*1.18)}return {l,cur:xp-acc,need,title:TITLES[Math.min(TITLES.length-1,Math.floor((l-1)/3))]}}
function streak(){let n=0;const d=new Date();for(;;){const k=dkey(d);const blocks=buildDay(d);const done=S.days[k]?blocks.filter(b=>S.days[k].done[b.id]).length:0;if(done>=Math.ceil(blocks.length*.6))n++;else if(k!==dkey(new Date()))break;d.setDate(d.getDate()-1);if(n>999)break}return n}
/* ---------- cronograma capilar e rotina ---------- */
const HAIR=['Hidratação','Nutrição','Reconstrução'];
function weekNum(d){const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()+3-(t.getDay()+6)%7);const w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/864e5-3+(w1.getDay()+6)%7)/7)}
function buildDay(d){// agenda do dia: home office, 8 h de sono, tudo sem sobreposição
  const dow=d.getDay(),Q1=d.getDate()<=15,wk=dow>=1&&dow<=5,sat=dow===6,work=wk||(sat&&S.workSat);const hair=HAIR[weekNum(d)%3];const washDay=[1,3,5,0].includes(dow);
  const on=k=>typeof hOn!=='function'||hOn(k);const B=[];const add=(id,t,dur,title,kind,xp,sub,extra)=>B.push(Object.assign({id,t:typeof t==='number'?toHM(t):t,dur,title,kind,xp,sub},extra||{}));
  const nd=new Date(d);nd.setDate(nd.getDate()+1);
  const w=toMin(wakeFor(d)),bed=bedFor(d);const gymQ1=(S.gymQ1||'casa')==='academia';
  const trainAt=(st,gymMode)=>{if(gymMode==='academia'){add('ida',st,30,'Ida para a academia','commute',5,'30 min de trajeto');add('treino',st+30,70,'Treino na academia','treino',50,'Toque para começar');add('volta',st+100,30,'Volta para casa','commute',5,'30 min de trajeto')}else add('treino',st,60,'Calistenia em casa','treino',45,'Treino com o peso do corpo')};
  // manhã
  add('acordar',w,0,'Acordar','sono',15,'Registre a hora em que acordou');let c=w;
  if(on('mae')){add('mae',c,4,'Mensagem pra mãe','mae',10,'4 minutinhos de carinho');c+=5}
  add('pele_am',c,15,'Skincare da manhã','pele',10,'Limpeza, vitamina C, hidratante e protetor');c+=15;
  const M=(work&&Q1?S.mealsQ1:S.mealsOut)||{};const meal=(k,def,n,sub,extra)=>{if(on('refeicoes'))add('ref_'+k,M[k]||def,0,n,'refeicao',5,sub,extra)};
  if(wk&&on('gatos')){meal('cafe',toHM(c),'Café da manhã','Junto com os gatos');add('gatos',c,40,'Cuidar dos gatos','gatos',20,'Comida, água, caixinha e brincadeira');c+=40}else{meal('cafe',toHM(c+5),'Café da manhã','Comece o dia com energia');c+=20}
  const read=(t,dur,sub)=>{if(on('leitura'))add('leitura',t,dur,'Leitura','leitura',15,sub)};
  if(work&&Q1){// 1ª quinzena: home office das 8h às 19h
    add('casa',c,60,'Arrumar a casa','casa',30,'1 hora de cronômetro, antes do expediente');
    add('trabalho','08:00',660,'Trabalho (home office)','trabalho',40,'Das 8h às 19h, em casa');
    meal('almoco','12:00','Almoço','Pausa de verdade para comer');
    if(gymQ1){add('estudo','12:30',60,'Estudos na pausa do almoço','estudo',0,'Marque o início e o fim')}else read('12:30',30,'30 min de livro na pausa do almoço');
    meal('lanche','16:00','Lanche','Pausa rápida para um café',{atWork:true});
    let e=19*60+5;
    if(on('treino')){if(gymQ1){trainAt(e,'academia');e+=130}else{trainAt(e,'casa');e+=60}}
    meal('jantar',toHM(e),'Jantar','Leve e sem pressa');e+=15;
    add('cabelo',e,20,washDay?'Lavar o cabelo · '+hair.toLowerCase():'Cuidar do cabelo','cabelo',10,washDay?'Cronograma capilar desta semana: '+hair:'Finalizar, pentear e proteger as pontas');e+=20;
    if(!gymQ1)add('estudo',e,60,'Estudos','estudo',0,'Marque o início e o fim');
  }else if(work){// 2ª quinzena: pelo menos 3 h de home office
    add('casa',c,60,'Arrumar a casa','casa',30,'1 hora de cronômetro');c+=60;
    const t0=Math.max(c+5,8*60);add('trabalho',t0,180,'Trabalho (home office)','trabalho',40,'Pelo menos 3 horas');
    meal('almoco',toHM(Math.max(t0+185,12*60)),'Almoço','Pausa de verdade para comer');
    add('estudo','13:30',120,'Estudos','estudo',0,'Marque o início e o fim');meal('lanche','15:40','Lanche','Uma fruta, um iogurte');
    if(on('treino'))trainAt(16*60+30,S.gymMode);meal('jantar','19:30','Jantar','Leve e sem pressa');
    add('cabelo','20:30',20,washDay?'Lavar o cabelo · '+hair.toLowerCase():'Cuidar do cabelo','cabelo',10,washDay?'Cronograma capilar desta semana: '+hair:'Finalizar, pentear e proteger as pontas');read('21:00',60,'De 30 min a 1 hora de livro');
  }else{// fim de semana
    add('casa',c+10,60,'Arrumar a casa','casa',30,'1 hora de cronômetro');add('estudo',c+90,90,'Estudos','estudo',0,'Marque o início e o fim');meal('almoco','12:30','Almoço','Pausa de verdade para comer');meal('lanche','15:30','Lanche','Uma fruta, um iogurte');
    if(sat&&on('treino'))trainAt(16*60,'academia');meal('jantar','19:30','Jantar','Leve e sem pressa');
    add('cabelo','20:30',20,washDay?'Lavar o cabelo · '+hair.toLowerCase():'Cuidar do cabelo','cabelo',10,washDay?'Cronograma capilar desta semana: '+hair:'Finalizar, pentear e proteger as pontas');read('21:00',60,'De 30 min a 1 hora de livro');
  }
  add('pele_pm',toMin(bed)-20,15,'Skincare da noite','pele',10,'Limpeza, sérum e hidratante');add('dormir',bed,0,'Dormir','sono',15,`Registre a hora em que deitou · amanhã acorda às ${wakeFor(nd)}`);
  return B.sort((a,b)=>toMin(a.t)-toMin(b.t))}
const MEALDEF={mealsQ1:{cafe:'06:20',almoco:'12:00',lanche:'16:00',jantar:'20:05'},mealsOut:{cafe:'07:20',almoco:'12:30',lanche:'15:40',jantar:'19:30'}};
function wakeFor(d){const dow=d.getDay(),Q1=d.getDate()<=15,work=(dow>=1&&dow<=5)||(dow===6&&S.workSat);return work?(Q1?S.wakeQ1:S.wakeQ2):(S.wakeFds||'08:00')}
function bedFor(d){const nd=new Date(d);nd.setDate(nd.getDate()+1);let b=toMin(wakeFor(nd))-(S.sleepGoal||8)*60;if(b<0)b+=1440;if(b<12*60)b=Math.min(b,0)+1440;// depois da meia-noite: limita a 23h30
  return toHM(Math.min(b,23*60+30))}

/* ---------- cronômetros dos blocos (estudo, trabalho, casa) ---------- */
function tmr(id,k){const d=day(k);return d.timers[id]||(d.timers[id]={total:0,run:null,log:[]})}
function readBonus(k){const t=(S.days[k]||{timers:{}}).timers.leitura;return t&&tmrNow(t)>=3600?10:0}
function tmrNow(t){return t.total+(t.run?(Date.now()-t.run)/1000:0)}
function tmrToggle(id){const t=tmr(id);if(t.run){const s=(Date.now()-t.run)/1000;t.total+=s;t.log.push([t.run,Date.now()]);t.run=null;beep(660,.12)}else{t.run=Date.now();beep(880,.12)}
  const b=buildDay(new Date()).find(b=>b.id===id);if(b&&b.dur&&tmrNow(t)>=(id==='leitura'?1800:b.dur*60*(id==='casa'?1:.999)))day().done[id]=true;save();render()}
function weekStudy(){const d=new Date();let s=0;for(let i=0;i<7;i++){const k=dkey(d);if(S.days[k]&&S.days[k].timers.estudo)s+=tmrNow(S.days[k].timers.estudo);d.setDate(d.getDate()-1)}return s}
/* ---------- som ---------- */
let AC=null;function beep(f=880,d=.15,v=.25){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}try{navigator.vibrate&&navigator.vibrate(d*400)}catch(e){}}

  const hip=[hx,hy],neck=[hx+Math.sin(t*R)*52,hy-Math.cos(t*R)*52],head=[neck[0]+Math.sin(t*R)*14,neck[1]-Math.cos(t*R)*14];
  const k1=dn(hip,th,44),f1=dn(k1,sh,44),k2=dn(hip,th2,44),ft2=dn(k2,sh2,44),e1=dn(neck,a,29),h1=dn(e1,f,27),e2=dn(neck,a2,29),h2=dn(e2,f2,27);
  const L=(p)=>p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');

const ANIMS=new Map();
function animate(svg,id){const P=EX[id].P;let t0=performance.now();const per=P.length>2?1100:1300;const step=now=>{if(!svg.isConnected){ANIMS.delete(svg);return}const t=(now-t0)/per;const n=P.length;let i,j,u;
    if(n===2){const c=t%2;u=c<1?c:2-c;i=0;j=1}else{const c=t%n;i=Math.floor(c);j=(i+1)%n;u=c-i}const e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    const A=P[i],B=P[j];const len=Math.max(A.length,B.length);const pose=[];for(let k=0;k<len;k++){const a=A[k]??A[k-4]??0,b=B[k]??B[k-4]??0;pose.push(a+(b-a)*e)}
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches||!svg.dataset.drawn){drawFig(svg,pose);svg.dataset.drawn=1}ANIMS.set(svg,requestAnimationFrame(step))};ANIMS.set(svg,requestAnimationFrame(step))}

function vHoje(){const now=new Date(),k=dkey(now),d=day(k),B=buildDay(now);const done=B.filter(b=>d.done[b.id]).length,p=done/B.length;const xp=totalXP(),L=level(xp),st=streak();const nowM=now.getHours()*60+now.getMinutes();

  B.forEach((b,i)=>{const isDone=!!d.done[b.id],cur=i===nextI;const end=b.dur?toHM(toMin(b.t)+b.dur):'';let act='';
    if(b.id==='estudo'||b.id==='trabalho'||b.id==='casa'){const t=tmr(b.id),s=tmrNow(t),goal=b.id==='trabalho'&&now.getDate()<=15?0:(b.id==='trabalho'?180:b.dur)*60;

  return h+`</ol><p class="foot muted">Estudos rendem 1 XP por minuto (até 120 por dia). Esta semana: ${fmtHm(weekStudy()/60)} de estudo.</p>`}

const CAL={on:{},vol:{},buf:{},src:{},gain:{},master:null,timerEnd:0,timerLen:0,narr:false};
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();if(!CAL.master){CAL.master=AC.createGain();CAL.master.gain.value=1;CAL.master.connect(AC.destination)}return AC}
async function sndBuf(id){if(CAL.buf[id])return CAL.buf[id];const b64=SND[id].split(',')[1];const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return CAL.buf[id]=await new Promise((res,rej)=>ac().decodeAudioData(u.buffer,res,rej))}
async function sndOn(id,vol){const a=ac();if(CAL.src[id])return;CAL.on[id]=true;const buf=await sndBuf(id);if(!CAL.on[id])return;const s=a.createBufferSource();s.buffer=buf;s.loop=true;s.loopStart=.06;s.loopEnd=buf.duration-.06;const g=a.createGain();g.gain.setValueAtTime(0,a.currentTime);g.gain.linearRampToValueAtTime(vol??CAL.vol[id]??.7,a.currentTime+2);
  s.connect(g);g.connect(CAL.master);s.start(0,.06);CAL.src[id]=s;CAL.gain[id]=g}
function sndOff(id,fade=1.5){CAL.on[id]=false;const s=CAL.src[id],g=CAL.gain[id];if(!s)return;const a=ac();g.gain.cancelScheduledValues(a.currentTime);g.gain.setValueAtTime(g.gain.value,a.currentTime);g.gain.linearRampToValueAtTime(0,a.currentTime+fade);setTimeout(()=>{try{s.stop()}catch(e){}},fade*1000+50);delete CAL.src[id];delete CAL.gain[id]}
function sndToggle(id){if(CAL.on[id])sndOff(id);else sndOn(id);if(!Object.values(CAL.on).some(Boolean))CAL.timerEnd=0;render()}
function sndVol(id,v){CAL.vol[id]=+v;const g=CAL.gain[id];if(g){const a=ac();g.gain.cancelScheduledValues(a.currentTime);g.gain.setTargetAtTime(+v,a.currentTime,.1)}}
function sndAllOff(){for(const id of Object.keys(CAL.on))if(CAL.on[id])sndOff(id,3);CAL.timerEnd=0}
function sndTimer(min){CAL.timerLen=min*60;CAL.timerEnd=min?Date.now()+min*60000:0;render()}
// sino de tigela tibetana, sintetizado (sem arquivo)
function bell(f0=196,dur=6){const a=ac(),t=a.currentTime;[[1,.5],[2.74,.22],[5.42,.12],[8.93,.06]].forEach(([m,v])=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f0*m;o.detune.value=(Math.random()-.5)*8;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*.35,t+.02);g.gain.exponentialRampToValueAtTime(.0005,t+dur/Math.pow(m,.4));o.connect(g);g.connect(CAL.master);o.start(t);o.stop(t+dur)})}

// arquivo de calendário (.ics) com alarme 1 dia antes: o iPhone avisa mesmo com o app fechado
function icsFor(list){const z=n=>String(n).padStart(2,'0');const now=new Date();const stamp=now.getUTCFullYear()+z(now.getUTCMonth()+1)+z(now.getUTCDate())+'T'+z(now.getUTCHours())+z(now.getUTCMinutes())+'00Z';const escI=s=>String(s||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const ev=list.map(e=>{const d=e.date.replace(/-/g,'');let when;if(e.time){const [h,m]=e.time.split(':').map(Number);const end=new Date(e.date+'T'+e.time+':00');end.setHours(end.getHours()+1);when=`DTSTART:${d}T${z(h)}${z(m)}00\r\nDTEND:${end.getFullYear()}${z(end.getMonth()+1)}${z(end.getDate())}T${z(end.getHours())}${z(end.getMinutes())}00`}
      else{const n=new Date(e.date+'T12:00:00');n.setDate(n.getDate()+1);when=`DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${n.getFullYear()}${z(n.getMonth()+1)}${z(n.getDate())}`}
      return `BEGIN:VEVENT\r\nUID:${e.id}@jogo-da-vida\r\nDTSTAMP:${stamp}\r\n${when}\r\nSUMMARY:${escI(e.title)}\r\nDESCRIPTION:${escI((e.type==='trabalho'?'Trabalho':'Pessoal')+(e.note?' · '+e.note:''))}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Amanhã: ${escI(e.title)}\r\nTRIGGER:-P1D\r\nEND:VALARM\r\nEND:VEVENT`}).join('\r\n');
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Jogo da Vida//PT-BR\r\nCALSCALE:GREGORIAN\r\n${ev}\r\nEND:VCALENDAR\r\n`}
async function evICS(id){const list=id?EVS().filter(e=>e.id===id):EVS().filter(e=>e.date>=dkey(new Date()));if(!list.length)return;const name=(id?list[0].title:'compromissos').replace(/[^\wÀ-ú -]/g,'').slice(0,40)+'.ics';
  const file=new File([icsFor(list)],name,{type:'text/calendar'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Abra o arquivo para adicionar ao Calendário')}

const FASES=[['Adaptação','Aprender a técnica com carga leve e criar o hábito',3,[12,15],60],['Hipertrofia I','Ganhar músculo com volume moderado',4,[10,12],75],['Força I','Carga mais pesada, poucas repetições, descanso longo',5,[5,6],120],
 ['Hipertrofia II','Mais carga que na fase 2, repetições médias',4,[8,10],90],['Resistência','Muitas repetições e pouco descanso, fôlego',3,[15,20],45],['Força II','Subir as cargas de novo, com técnica perfeita',5,[4,6],150],
 ['Hipertrofia III','Última série de cada exercício perto da falha',4,[10,12],60],['Potência','Movimentos rápidos e explosivos na subida',4,[6,6],90],['Hipertrofia IV','Volume alto, cargas das fases de força',4,[8,12],75],
 ['Força III','Os maiores pesos da jornada',5,[3,5],180],['Consolidação e recordes','Manter o que conquistou e testar seus recordes',3,[8,10],90]];
const EXTYPE={prancha:'tempo',polichinelo:'cardio',escalador:'cardio',extensora:'iso',panturrilha:'iso',rosca:'iso',triceps:'iso',abdominal:'iso',ponte:'iso',superman:'iso'};
const BODYW=new Set(['flexao','barra','mergulho','afundo','agachamento','saltoagach','ponte','abdominal','superman']);
function progAt(d){d=d||new Date();const jd=Math.max(1,jDay(d));const sN=Math.min(NSEAS(),Math.floor((jd-1)/66)+1);const inS=jd-(sN-1)*66;const wk=Math.ceil(inS/7);const F=FASES[(sN-1)%FASES.length];
  return {season:sN,phase:F[0],obj:F[1],sets:F[2],reps:F[3],rest:F[4],week:wk,weeks:Math.ceil(sLen(sN)/7),deload:wk===5||wk===9}}
function repTxt(r){return r[0]===r[1]?`${r[0]}`:`${r[0]}–${r[1]}`}
function exParams(e,P,mode){const t=EXTYPE[e.id];if(t==='tempo')return {sets:P.deload?2:3,reps:[30+P.season*3,30+P.season*3],rest:45,unit:'s'};if(t==='cardio')return {sets:P.deload?2:3,reps:[30+P.season*2,40+P.season*2],rest:30,unit:'rep'};
  let sets=t==='iso'?Math.min(3,P.sets):P.sets,reps=t==='iso'?[Math.max(10,P.reps[0]),Math.max(12,P.reps[1])]:P.reps.slice();
  if(mode==='casa'&&BODYW.has(e.id)){const k={flexao:.8,barra:.45,mergulho:.9}[e.id]||1.5;reps=reps.map(x=>Math.max(2,Math.round(x*k)))}if(P.deload)sets=Math.max(2,Math.round(sets*.6));return {sets,reps,rest:P.rest,unit:'rep'}}
function planFor(mode,i){const P=progAt();const p=S.plans[mode][i];const ex=p.ex.slice();const sh=(P.season-1)%Math.max(1,ex.length);const rot=ex.slice(sh).concat(ex.slice(0,sh));// rodízio da ordem a cada temporada
  return {name:p.name,ex:rot.map(e=>{const q=exParams(e,P,mode);return {...e,sets:q.sets,reps:q.reps[1],range:q.reps,rest:q.rest,unit:q.unit}})}}
function todayPlan(mode){const n=S.history.filter(h=>h.mode===mode).length;return n%Math.max(1,S.plans[mode].length)}
function curGym(d){d=d||new Date();const dow=d.getDay(),work=(dow>=1&&dow<=5)||(dow===6&&S.workSat);return work&&d.getDate()<=15?(S.gymQ1||'casa'):S.gymMode}
